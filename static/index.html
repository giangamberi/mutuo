<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Torrent Reader</title>
<style>
  :root { --bg:#14161a; --panel:#1e2128; --text:#e6e9ef; --dim:#8a93a5; --acc:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:8px 14px; background:var(--panel); border-bottom:1px solid #000; }
  header h1 { font-size:15px; margin:0 14px 0 0; font-weight:600; }
  header .grow { flex:1; }
  button, input, select { background:#0f1115; color:var(--text); border:1px solid #333a47; border-radius:6px; padding:6px 10px; font-size:13px; }
  input { min-width:280px; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:320px; min-width:240px; background:var(--panel); border-right:1px solid #000; overflow-y:auto; }
  .t { padding:10px 14px; border-bottom:1px solid #262b34; }
  .t .name { font-size:13px; font-weight:600; }
  .t .meta { font-size:11px; color:var(--dim); margin-top:3px; }
  .bar { height:4px; background:#0f1115; border-radius:2px; margin-top:6px; overflow:hidden; }
  .bar > div { height:100%; background:var(--acc); }
  .files { font-size:12px; margin-top:6px; }
  .files a { color:var(--acc); cursor:pointer; text-decoration:none; display:block; padding:2px 0; }
  .files a:hover { text-decoration:underline; }
  #viewer { flex:1; display:flex; flex-direction:column; align-items:center; overflow-y:auto; padding:12px; }
  #page { background:#fff; margin-bottom:10px; }
  #status { font-size:12px; color:var(--dim); margin-bottom:8px; }
  .empty { color:var(--dim); font-size:13px; margin-top:24px; }
</style>
</head>
<body>
<header>
  <h1>PDF Torrent Reader</h1>
  <input id="magnet" placeholder="magnet:?xt=urn:btih:...">
  <button onclick="addMagnet()">Add</button>
  <button onclick="syncFeed()">Sync feed</button>
  <div class="grow"></div>
  <span id="hdrstat" style="font-size:12px;color:var(--dim)"></span>
</header>
<main>
  <aside id="catalog"></aside>
  <section id="viewer">
    <div id="status"></div>
    <div class="empty" id="empty">Pick a PDF from the catalog — it starts downloading when you open it.</div>
    <div id="pages" style="display:none"></div>
  </section>
</main>
<script type="module">
import * as pdfjsLib from '/static/pdfjs-dist/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/pdfjs-dist/build/pdf.worker.min.mjs';
let current = null; // {ih, f, name, doc}

async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r; }

async function refresh() {
  try {
    const torrents = await j('/api/torrents').then(r => r.json());
    const catalog = await j('/api/catalog').then(r => r.json());
    const byMagnet = Object.fromEntries(catalog.map(c => [magnetKey(c.magnet), c]));
    const el = document.getElementById('catalog');
    el.innerHTML = '';
    for (const t of torrents) {
      const c = byMagnet[magnetKey(t.magnet)] || {};
      const pct = Math.round(t.progress * 100);
      const div = document.createElement('div');
      div.className = 't';
      div.innerHTML = `<div class="name">${esc(c.name || t.name)}</div>
        <div class="meta">${t.state} · ${pct}% · ${t.num_peers} peers</div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="files"></div>`;
      const files = div.querySelector('.files');
      for (const f of (t.files || [])) {
        if (!/\.pdf$/i.test(f.name)) continue;
        const a = document.createElement('a');
        a.textContent = f.name;
        a.onclick = () => openPdf(t.info_hash, f.index, f.name, f.size);
        files.appendChild(a);
      }
      el.appendChild(div);
    }
    document.getElementById('hdrstat').textContent =
      torrents.length ? `${torrents.length} torrent(s)` : 'no torrents — add one or point feed.json at a source';
  } catch (e) { /* server still starting */ }
}

function magnetKey(m) { for (const p of m.split('&')) if (p.startsWith('xt=')) return p.slice(3); return m; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

window.addMagnet = async function () {
  const magnet = document.getElementById('magnet').value.trim();
  if (!magnet.startsWith('magnet:')) { alert('paste a magnet: URI'); return; }
  try {
    await j('/api/catalog', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name: magnet.slice(10, 60), magnet})});
    document.getElementById('magnet').value = '';
    refresh();
  } catch (e) { alert(e.message); }
};

window.syncFeed = async function () {
  try { const r = await j('/api/sync', {method:'POST'}).then(r => r.json());
    alert(`synced: +${r.added} new torrent(s)`); refresh();
  } catch (e) { alert(e.message); }
};

async function openPdf(ih, f, name, size) {
  if (current) { try { current.doc.destroy(); } catch {} current = null; }
  const pages = document.getElementById('pages');
  const empty = document.getElementById('empty');
  empty.style.display = 'none';
  pages.style.display = '';
  pages.innerHTML = '';
  const status = document.getElementById('status');
  status.textContent = `Loading ${name} — waiting on swarm for pieces…`;
  // PDF.js requests the header range first; the server blocks until those
  // pieces are verified, so first paint starts as soon as head of file lands.
  const task = pdfjsLib.getDocument({ url: `/api/pdf?ih=${ih}&f=${f}` });
  current = { ih, f, name, doc: null };
  try {
    const doc = await task.promise;
    current.doc = doc;
    status.textContent = `${name} — ${doc.numPages} pages`;
    for (let p = 1; p <= doc.numPages; p++) await renderPage(doc, p, pages);
  } catch (e) {
    status.textContent = `Failed to load ${name}: ${e.message}`;
    empty.style.display = ''; empty.textContent = status.textContent;
    pages.style.display = 'none';
  }
}

async function renderPage(doc, p, container) {
  const page = await doc.getPage(p);
  const viewport = page.getViewport({ scale: 1.25 });
  const canvas = document.createElement('canvas');
  canvas.id = `page-${p}`;
  canvas.width = viewport.width; canvas.height = viewport.height;
  canvas.style.width = '720px';
  container.appendChild(canvas);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
}

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
